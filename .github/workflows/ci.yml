name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: ci, POSTGRES_PASSWORD: ci, POSTGRES_DB: privatepath_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/privatepath_test
      PGPASSWORD: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install -g pnpm@12.14.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @privatepath/db generate
      - name: Apply migrations
        run: for m in packages/db/prisma/migrations/*/migration.sql; do psql -h localhost -U ci -d privatepath_test -v ON_ERROR_STOP=1 -q -f "$m"; done
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @privatepath/web build
      - name: Dependency audit (fails on high severity)
        run: pnpm audit --audit-level high
